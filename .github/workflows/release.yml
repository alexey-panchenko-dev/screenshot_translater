name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Test
        run: |
          python -m pytest
          python -m ruff check .

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.0" }
          .\build.ps1 -Installer -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Setup
          path: dist/installer/ScreenTranslator-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" "dist/installer/ScreenTranslator-Setup.exe" --clobber
          } else {
            gh release create "${{ github.ref_name }}" "dist/installer/ScreenTranslator-Setup.exe" --generate-notes --title "Screen Translator ${{ github.ref_name }}"
          }
