[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-translator"
version = "0.1.0"
description = "Fast Windows screen-region translator"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cmudict>=1.0,<2",
    "httpx>=0.28,<1",
    "mss>=10.0,<11",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pyinstaller>=6.16,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
screen-translator = "screen_translator.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
